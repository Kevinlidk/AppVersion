<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f4f6fb">
<title>应用版本检测</title>
<!-- 动态背景引擎样式(先引入,便于页面样式覆盖墨色) -->
<link rel="stylesheet" href="background/engine.css">
<style>
  /* ── 主题 ────────────────────────────────────────────────
     UI(卡片/顶栏/文字)在两种主题下都保持浅色;
     只有"画布底色 + 背景墨色 + 压在画布上的文字"随主题切换。
     默认浅色;切换按钮把选择存进 localStorage。 */
  :root {
    --card: #ffffff;
    --text: #101828;
    --muted: #667085;
    --border: #e4e7ec;
    --accent: #2563eb;
    --accent-weak: #eff4ff;
    --ok: #067647;
    --ok-bg: #ecfdf3;
    --warn: #b54708;
    --warn-bg: #fffaeb;
    --danger: #d92d20;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);

    /* 浅色显示(默认):浅底 + 中灰字形,动效参数与深色完全一致 */
    --page-bg: #f4f6fb;
    --bg-ink: #6b7688;
    --haze: none;
    --on-canvas: #667085;
    --link-on-canvas: #2563eb;
  }
  html[data-theme="dark"] {
    /* 深色显示:#333 底 + 白色薄雾层 + 浅灰字形(参考项目同款) */
    --page-bg: #333;
    --bg-ink: #8a93a0;
    --haze: linear-gradient(rgba(255, 255, 255, .10), rgba(255, 255, 255, .04));
    --on-canvas: #c3cbdb;
    --link-on-canvas: #93c5fd;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--page-bg); color-scheme: light; }
  /* 背景墨色:引擎每帧读取 #bg-stage 的 computed color,切换主题即时生效 */
  #bg-stage { color: var(--bg-ink); }
  /* 薄雾高光层:仅深色主题启用,叠在画布之上、内容之下 */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background: var(--haze);
  }
  body {
    margin: 0;
    background: transparent;
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .container { max-width: 760px; margin: 0 auto; padding: 0 16px; }
  .hidden { display: none !important; }

  /* ── 顶栏 ── */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    padding-top: env(safe-area-inset-top);
    /* 深色动态背景之上用实色浅色顶栏,保证标题与按钮清晰可读 */
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }
  /* 注意:仅设纵向内边距,避免覆盖 .container 的左右 16px 内边距 */
  .topbar-inner { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 56px; padding-top: 8px; padding-bottom: 8px; }
  h1 { font-size: 17px; margin: 0; display: flex; align-items: center; gap: 8px; }
  .top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .github-link, .icon-btn {
    display: flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; border-radius: 10px;
    border: none; padding: 0; background: transparent; cursor: pointer;
    color: var(--text); transition: transform .06s, background .2s, color .2s;
  }
  .github-link:hover, .icon-btn:hover { background: var(--accent-weak); color: var(--accent); }
  .github-link:active, .icon-btn:active { transform: scale(.94); }
  .github-link:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .admin-chip {
    font-size: 12.5px; font-weight: 600; white-space: nowrap;
    color: var(--ok); background: var(--ok-bg);
    padding: 5px 11px; border-radius: 999px;
  }
  @media (max-width: 430px) {
    h1 { font-size: 15px; }
    .btn { padding: 0 11px; font-size: 13.5px; }
    /* 窄屏:管理员徽章收起(登录态由「退出」表达),
       「全部刷新」只留图标,给主题/仓库图标腾出空间,顶栏保持单行 */
    .admin-chip { display: none !important; }
    .top-actions { gap: 6px; }
    #refreshAllBtn .lbl { display: none; }
    #refreshAllBtn { padding: 0 10px; }
  }

  /* ── 按钮 ── */
  .btn {
    min-height: 40px; padding: 0 14px;
    border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text);
    font-size: 14px; font-weight: 500; cursor: pointer;
    transition: transform .06s, opacity .2s;
  }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.danger-text { color: var(--danger); }
  .btn[disabled] { opacity: .55; pointer-events: none; }

  /* ── 工具栏 ── */
  .toolbar { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  @media (min-width: 560px) { .toolbar { flex-direction: row; align-items: center; } }
  #searchInput {
    flex: 1; width: 100%; min-height: 42px;
    border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text);
    padding: 0 14px; font-size: 16px;
  }
  #searchInput:focus, dialog input:focus, dialog select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    min-height: 38px; padding: 0 14px;
    border-radius: 999px; border: 1px solid var(--border);
    background: var(--card); color: var(--muted);
    font-size: 13px; cursor: pointer;
  }
  .chip.active { background: var(--accent-weak); color: var(--accent); border-color: var(--accent); font-weight: 600; }
  .stats { font-size: 13px; margin-top: 12px; min-height: 1.2em; }
  /* 以下文本直接压在动态背景上,颜色随主题切换(卡片内不受影响) */
  .stats, .empty, .footer { color: var(--on-canvas); }
  .footer a { color: var(--link-on-canvas); }
  .manage { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  .manage .btn { min-height: 34px; padding: 0 12px; font-size: 13px; }

  /* ── 应用卡片 ── */
  .list { display: grid; gap: 12px; margin-top: 12px; }
  @media (min-width: 640px) { .list { grid-template-columns: 1fr 1fr; } }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px;
    box-shadow: var(--shadow);
  }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .app-name { font-size: 16px; font-weight: 600; margin: 0; overflow-wrap: anywhere; }
  .badge {
    flex-shrink: 0; font-size: 12px; font-weight: 600;
    padding: 3px 9px; border-radius: 999px;
    background: var(--accent-weak); color: var(--accent);
  }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .ver { display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 10px 0 4px; }
  .ver-label { color: var(--muted); font-size: 12.5px; margin-right: 6px; }
  .ver b { font-size: 14.5px; overflow-wrap: anywhere; }
  /* 最新版本号统一用绿色显示(有新版本与否都保持绿色,更新状态由徽章表达) */
  .ver b.latest { color: var(--ok); }
  .meta { color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
  .meta a { color: var(--accent); text-decoration: none; overflow-wrap: anywhere; }
  .meta a:active { opacity: .7; }
  .note { font-size: 13px; color: var(--muted); margin: 8px 0 0; overflow-wrap: anywhere; }
  .card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .card-actions .btn { min-height: 36px; padding: 0 12px; font-size: 13px; }

  /* ── 空状态 ── */
  .empty { text-align: center; color: var(--muted); padding: 56px 16px 32px; }
  .empty .big { font-size: 44px; margin-bottom: 8px; }
  .empty .btn { margin-top: 14px; }

  /* ── 悬浮添加按钮 ── */
  .fab {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom));
    width: 56px; height: 56px; border-radius: 50%;
    border: none; background: var(--accent); color: #fff;
    font-size: 28px; line-height: 1; cursor: pointer; z-index: 20;
    box-shadow: 0 8px 24px rgba(37, 99, 235, .35);
    transition: transform .08s;
  }
  .fab:active { transform: scale(.94); }

  /* ── 弹窗表单 ── */
  dialog {
    border: none; border-radius: 16px;
    background: var(--card); color: var(--text);
    width: min(420px, 92vw); padding: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
  }
  dialog::backdrop { background: rgba(2, 6, 23, .55); }
  dialog h2 { font-size: 17px; margin: 0 0 4px; }
  dialog label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-top: 14px; }
  dialog input, dialog select {
    width: 100%; margin-top: 6px; min-height: 42px;
    border-radius: 10px; border: 1px solid var(--border);
    background: #f4f6fb; color: var(--text);
    padding: 8px 12px; font-size: 16px;
  }
  dialog label.check-row {
    display: flex; align-items: center; gap: 10px;
    margin-top: 16px; font-size: 14px; font-weight: 500; color: var(--text);
  }
  dialog label.check-row input {
    width: 19px; height: 19px; min-height: 0; margin: 0; padding: 0;
    accent-color: var(--accent); flex-shrink: 0;
  }
  .hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

  /* ── 轻提示 ── */
  .toast {
    position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(8px);
    background: #101828; color: #fff;
    padding: 10px 16px; border-radius: 10px;
    font-size: 14px; max-width: 88vw; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    z-index: 30;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--danger); }

  .footer { text-align: center; font-size: 12.5px; padding: 28px 0 96px; }
  .footer a { text-decoration: none; }
</style>
<script>
/* 尽早应用主题,避免首屏闪一下(默认浅色) */
(function () {
  try {
    var saved = localStorage.getItem("av_theme");
    document.documentElement.dataset.theme = saved === "dark" ? "dark" : "light";
  } catch (e) {
    document.documentElement.dataset.theme = "light";
  }
})();
</script>
</head>
<body>

<div id="bg-stage" aria-hidden="true"></div>

<header class="topbar">
  <div class="container topbar-inner">
    <h1><span aria-hidden="true">📦</span>应用版本检测</h1>
    <div class="top-actions">
      <button id="refreshAllBtn" class="btn ghost hidden"><span aria-hidden="true">⟳</span><span class="lbl"> 全部刷新</span></button>
      <span id="adminBadge" class="admin-chip hidden">管理员</span>
      <button id="logoutBtn" class="btn ghost hidden">退出</button>
      <button id="loginBtn" class="btn ghost">登录</button>
      <button id="themeToggle" class="icon-btn" type="button" aria-label="切换到深色显示" title="切换到深色显示">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <a class="github-link" href="https://github.com/Kevinlidk/AppVersion" target="_blank" rel="noopener noreferrer" aria-label="GitHub 仓库" title="GitHub 仓库：Kevinlidk/AppVersion">
        <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
    </div>
  </div>
</header>

<main class="container">
  <div class="toolbar">
    <input id="searchInput" type="search" placeholder="搜索名称、仓库或备注…" autocomplete="off">
    <div class="chips" id="channelChips">
      <button class="chip active" data-channel="all">全部</button>
      <button class="chip" data-channel="github">GitHub</button>
      <button class="chip" data-channel="chocolatey">Choco</button>
      <button class="chip" data-channel="winget">winget</button>
      <button class="chip" data-channel="manual">手动</button>
    </div>
  </div>

  <div id="stats" class="stats"></div>
  <div id="manageRow" class="manage hidden">
    <button id="exportBtn" class="btn">⬇ 导出配置</button>
    <button id="importBtn" class="btn">⬆ 导入配置</button>
  </div>
  <div id="list" class="list"></div>

  <div id="emptyState" class="empty hidden">
    <div class="big" aria-hidden="true">📭</div>
    <p>还没有关注任何应用<br>添加后即可在这里跟踪它们的最新版本</p>
    <button class="btn primary" id="emptyAddBtn">＋ 添加第一个应用</button>
  </div>
</main>

<button id="addBtn" class="fab hidden" aria-label="添加应用">＋</button>

<dialog id="appDialog">
  <form id="appForm" novalidate>
    <h2 id="dlgTitle">添加应用</h2>
    <label>应用名称
      <input name="name" required maxlength="50" placeholder="如:Telegram Desktop">
    </label>
    <label>版本来源
      <select name="channel" id="channelSelect">
        <option value="github">GitHub Releases(自动查询)</option>
        <option value="chocolatey">Chocolatey 社区源(自动查询)</option>
        <option value="winget">winget 官方源(自动查询)</option>
        <option value="manual">手动维护</option>
      </select>
    </label>
    <p class="hint" id="channelHint"></p>
    <label id="sourceLabel"><span id="sourceLabelText">仓库(owner/repo)</span>
      <input name="source" id="sourceInput" maxlength="100" autocapitalize="off" spellcheck="false">
    </label>
    <label><span id="versionLabelText">当前版本</span>
      <input name="version" maxlength="50" placeholder="如:v1.2.3">
    </label>
    <label>备注
      <input name="note" maxlength="100" placeholder="可选">
    </label>
    <label class="check-row">
      <input type="checkbox" id="notifyInput">
      <span>发现新版本时推送通知(渠道配置见 README)</span>
    </label>
    <div class="dlg-actions">
      <button type="button" class="btn ghost" id="cancelBtn">取消</button>
      <button type="submit" class="btn primary" id="saveBtn">保存</button>
    </div>
  </form>
</dialog>

<dialog id="loginDialog">
  <form id="loginForm" novalidate>
    <h2>管理员登录</h2>
    <p class="hint">密码来自环境变量 ADMIN_PASSWORD;登录后可编辑监控应用,访客仅可查看。</p>
    <label>密码
      <input type="password" name="password" id="passwordInput" maxlength="100" placeholder="管理员密码" autocomplete="current-password">
    </label>
    <div class="dlg-actions">
      <button type="button" class="btn ghost" id="loginCancelBtn">取消</button>
      <button type="submit" class="btn primary" id="loginSubmitBtn">登录</button>
    </div>
  </form>
</dialog>

<dialog id="importDialog">
  <form id="importForm" novalidate>
    <h2>导入配置</h2>
    <p class="hint">选择之前导出的 JSON 配置文件。<b>导入将覆盖当前全部应用列表</b>,且不可撤销。</p>
    <label>配置文件
      <input type="file" id="importFile" accept=".json,application/json">
    </label>
    <div class="dlg-actions">
      <button type="button" class="btn ghost" id="importCancelBtn">取消</button>
      <button type="submit" class="btn primary" id="importSubmitBtn">导入</button>
    </div>
  </form>
</dialog>

<footer class="footer">
  AppVersion · 运行于 Cloudflare Workers ·
  <a href="https://github.com/Kevinlidk/AppVersion" target="_blank" rel="noopener">GitHub 仓库</a>
</footer>

<div id="toast" class="toast" role="status"></div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const listEl = $("#list");
let apps = [];
let filter = { q: "", channel: "all" };
let editingId = null;
let isAdmin = false;
let authConfigured = false;

const normV = (v) => String(v || "").trim().replace(/^v/i, "");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
));

async function api(path, opts = {}) {
  const init = { ...opts };
  if (init.body && typeof init.body !== "string") {
    init.body = JSON.stringify(init.body);
    init.headers = { "content-type": "application/json", ...(init.headers || {}) };
  }
  const res = await fetch(path, init);
  let data = {};
  try { data = await res.json(); } catch { /* 非JSON响应 */ }
  if (!res.ok) {
    // 会话过期时自动退回访客视图
    if (res.status === 401 && isAdmin) { isAdmin = false; renderAdminUi(); }
    throw new Error(data.error || "请求失败(HTTP " + res.status + ")");
  }
  return data;
}

let toastTimer = null;
function toast(msg, type) {
  const el = $("#toast");
  el.textContent = msg;
  el.className = "toast show" + (type === "error" ? " error" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = "toast"; }, 2600);
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const sameYear = d.getFullYear() === new Date().getFullYear();
  const opts = sameYear
    ? { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }
    : { year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" };
  return d.toLocaleString("zh-CN", opts);
}

/* ── 登录态 ── */

async function initSession() {
  try {
    const s = await api("/api/session");
    isAdmin = Boolean(s.admin);
    authConfigured = Boolean(s.configured);
  } catch { /* 网络异常时按访客处理 */ }
}

function renderAdminUi() {
  $("#refreshAllBtn").classList.toggle("hidden", !isAdmin);
  $("#loginBtn").classList.toggle("hidden", isAdmin || !authConfigured);
  $("#adminBadge").classList.toggle("hidden", !isAdmin);
  $("#logoutBtn").classList.toggle("hidden", !isAdmin);
  $("#addBtn").classList.toggle("hidden", !isAdmin);
  $("#emptyAddBtn").classList.toggle("hidden", !isAdmin);
  $("#manageRow").classList.toggle("hidden", !isAdmin);
  render();
}

/* ── 列表渲染 ── */

/* none=尚未查询 fresh=已获取最新但未记录当前版本 ok=已是最新 update=有新版本 */
function statusOf(a) {
  if (a.channel === "manual" || !a.latestVersion) return "none";
  if (!a.version) return "fresh";
  return normV(a.latestVersion) === normV(a.version) ? "ok" : "update";
}

function badgeOf(a) {
  const st = statusOf(a);
  if (st === "update") return '<span class="badge warn">有新版本</span>';
  if (st === "ok") return '<span class="badge ok">已是最新</span>';
  if (st === "fresh") return '<span class="badge">已获取</span>';
  return "";
}

function sourceMeta(a) {
  if (a.channel === "github") {
    if (a.repo) return { label: a.repo, url: a.releaseUrl || "https://github.com/" + a.repo };
    return { label: "GitHub" };
  }
  if (a.channel === "chocolatey") {
    if (a.packageId) return { label: a.packageId, url: a.releaseUrl || "https://community.chocolatey.org/packages/" + a.packageId };
    return { label: "Chocolatey" };
  }
  if (a.channel === "winget") {
    if (a.packageId) return { label: a.packageId, url: a.releaseUrl || "https://winget.run/pkg/" + a.packageId };
    return { label: "winget" };
  }
  return { label: "手动维护" };
}

function cardHtml(a) {
  const manual = a.channel === "manual";
  const st = statusOf(a);
  const src = sourceMeta(a);
  const meta = [];
  if (src.url) meta.push('<a href="' + esc(src.url) + '" target="_blank" rel="noopener">' + esc(src.label) + "</a>");
  else meta.push(esc(src.label));
  if (a.lastCheckedAt) meta.push("检查于 " + esc(fmtTime(a.lastCheckedAt)));
  const actions = isAdmin ? `
      <div class="card-actions">
        ${!manual ? '<button class="btn act-refresh">⟳ 刷新</button>' : ""}
        ${st === "update" ? '<button class="btn act-marked">已更新</button>' : ""}
        <button class="btn act-edit">编辑</button>
        <button class="btn danger-text act-del">删除</button>
      </div>` : "";
  return `
    <article class="card" data-id="${a.id}">
      <div class="card-top"><h3 class="app-name">${esc(a.name)}</h3>${badgeOf(a)}</div>
      <div class="ver">
        <div><span class="ver-label">${manual ? "版本" : "当前"}</span><b>${esc(a.version || "—")}</b></div>
        ${!manual && a.latestVersion ? `<div><span class="ver-label">最新</span><b class="latest">${esc(a.latestVersion)}</b></div>` : ""}
      </div>
      <div class="meta">${meta.join('<span aria-hidden="true">·</span>')}</div>
      ${a.note ? `<p class="note">${esc(a.note)}</p>` : ""}
      ${actions}
    </article>`;
}

function render() {
  const q = filter.q.trim().toLowerCase();
  const shown = apps.filter((a) => {
    if (filter.channel !== "all" && a.channel !== filter.channel) return false;
    if (!q) return true;
    return [a.name, a.repo, a.packageId, a.note].some((v) => (v || "").toLowerCase().includes(q));
  });
  const updateCount = apps.filter((a) => statusOf(a) === "update").length;
  $("#stats").textContent = apps.length
    ? "共 " + apps.length + " 个应用" + (updateCount ? ",其中 " + updateCount + " 个有更新" : "")
    : "";
  listEl.innerHTML = shown.map(cardHtml).join("");
  $("#emptyState").classList.toggle("hidden", apps.length > 0);
}

async function load() {
  try {
    apps = await api("/api/apps");
    render();
  } catch (e) {
    listEl.innerHTML = `
      <div class="empty">
        <div class="big" aria-hidden="true">⚠️</div>
        <p>${esc(e.message)}</p>
      </div>`;
    $("#emptyState").classList.add("hidden");
  }
}

/* ── 单个刷新 / 全部刷新 ── */

async function refreshOne(id, btn) {
  if (btn) {
    btn.disabled = true;
    btn.dataset.orig = btn.textContent;
    btn.textContent = "查询中…";
  }
  try {
    const updated = await api("/api/apps/" + id + "/refresh", { method: "POST" });
    apps = apps.map((a) => (a.id === id ? updated : a));
    render();
    const st = statusOf(updated);
    toast(st === "update" ? "发现新版本:" + updated.name + " " + updated.latestVersion
      : st === "ok" ? updated.name + " 已是最新"
      : "查询完成:" + updated.name);
  } catch (e) {
    toast(e.message, "error");
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = btn.dataset.orig; }
  }
}

async function refreshAll() {
  const targets = apps.filter((a) => a.channel !== "manual");
  if (!targets.length) { toast("没有可自动查询的应用"); return; }
  const btn = $("#refreshAllBtn");
  const label = (html) => { btn.innerHTML = html; };
  btn.disabled = true;
  let ok = 0, fail = 0;
  for (let i = 0; i < targets.length; i++) {
    label('<span class="lbl">刷新中 ' + (i + 1) + "/" + targets.length + "</span>");
    try {
      const updated = await api("/api/apps/" + targets[i].id + "/refresh", { method: "POST" });
      apps = apps.map((a) => (a.id === updated.id ? updated : a));
      ok++;
    } catch { fail++; }
    render();
  }
  btn.disabled = false;
  label('<span aria-hidden="true">⟳</span><span class="lbl"> 全部刷新</span>');
  toast("刷新完成:" + ok + " 成功" + (fail ? "," + fail + " 失败" : ""), ok ? undefined : "error");
}

/* ── 删除 / 标记已更新 ── */

async function del(app) {
  if (!confirm("确定删除「" + app.name + "」吗?")) return;
  try {
    await api("/api/apps/" + app.id, { method: "DELETE" });
    apps = apps.filter((a) => a.id !== app.id);
    render();
    toast("已删除");
  } catch (e) { toast(e.message, "error"); }
}

async function markUpdated(app) {
  try {
    const updated = await api("/api/apps/" + app.id, { method: "PUT", body: { version: app.latestVersion } });
    apps = apps.map((a) => (a.id === app.id ? updated : a));
    render();
    toast("已标记为 " + updated.version);
  } catch (e) { toast(e.message, "error"); }
}

/* ── 添加 / 编辑弹窗 ── */

const dlg = $("#appDialog");
const form = $("#appForm");

const CHANNEL_META = {
  github: {
    label: "仓库(owner/repo)",
    placeholder: "如:telegramdesktop/tdesktop",
    hint: "通过 GitHub API 自动查询最新 Release",
  },
  chocolatey: {
    label: "包 ID(Chocolatey)",
    placeholder: "如:vlc,或直接粘贴包页面链接",
    hint: "查询 Chocolatey 社区源官方 API(UniGetUI 聚合的同一数据源)",
  },
  winget: {
    label: "包 ID(winget)",
    placeholder: "如:VideoLAN.VLC",
    hint: "查询 winget 官方清单仓库,包 ID 需含发布者前缀",
  },
  manual: {
    label: "",
    placeholder: "",
    hint: "不自动查询,需要时手动更新版本号",
  },
};

function syncChannelUi() {
  const ch = form.channel.value;
  const m = CHANNEL_META[ch];
  const auto = ch !== "manual";
  $("#sourceLabel").classList.toggle("hidden", !auto);
  if (auto) {
    $("#sourceLabelText").textContent = m.label;
    $("#sourceInput").placeholder = m.placeholder;
  }
  $("#channelHint").textContent = m.hint;
  $("#versionLabelText").textContent = auto ? "当前版本" : "版本号";
}

function openDialog(app) {
  editingId = app ? app.id : null;
  $("#dlgTitle").textContent = app ? "编辑应用" : "添加应用";
  form.name.value = app ? app.name : "";
  form.channel.value = app ? app.channel : "github";
  form.source.value = app ? (app.repo || app.packageId || "") : "";
  form.version.value = app ? (app.version || "") : "";
  form.note.value = app ? (app.note || "") : "";
  $("#notifyInput").checked = app ? app.notify === true : false;
  syncChannelUi();
  dlg.showModal();
}

form.channel.addEventListener("change", syncChannelUi);
$("#cancelBtn").addEventListener("click", () => dlg.close());
dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const ch = form.channel.value;
  const source = form.source.value.trim();
  const payload = {
    name: form.name.value.trim(),
    channel: ch,
    version: form.version.value.trim(),
    note: form.note.value.trim(),
    notify: $("#notifyInput").checked,
  };
  if (ch === "github") payload.repo = source;
  else if (ch !== "manual") payload.packageId = source;
  if (!payload.name) { toast("请填写应用名称", "error"); return; }
  if (ch === "github" && !payload.repo) { toast("请填写仓库 owner/repo", "error"); return; }
  if ((ch === "chocolatey" || ch === "winget") && !payload.packageId) { toast("请填写包 ID", "error"); return; }
  const saveBtn = $("#saveBtn");
  saveBtn.disabled = true;
  try {
    if (editingId) {
      const updated = await api("/api/apps/" + editingId, { method: "PUT", body: payload });
      apps = apps.map((a) => (a.id === editingId ? updated : a));
      toast("已保存");
    } else {
      const created = await api("/api/apps", { method: "POST", body: payload });
      apps.unshift(created);
      toast("已添加,正在查询最新版本…");
      if (created.channel !== "manual") refreshOne(created.id).catch(() => {});
    }
    render();
    dlg.close();
  } catch (err) {
    toast(err.message, "error");
  } finally {
    saveBtn.disabled = false;
  }
});

/* ── 管理员登录 / 退出 ── */

const loginDlg = $("#loginDialog");
const loginForm = $("#loginForm");

$("#loginBtn").addEventListener("click", () => {
  $("#passwordInput").value = "";
  loginDlg.showModal();
});
$("#loginCancelBtn").addEventListener("click", () => loginDlg.close());
loginDlg.addEventListener("click", (e) => { if (e.target === loginDlg) loginDlg.close(); });

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const pwd = $("#passwordInput").value;
  if (!pwd) { toast("请输入密码", "error"); return; }
  const btn = $("#loginSubmitBtn");
  btn.disabled = true;
  try {
    await api("/api/login", { method: "POST", body: { password: pwd } });
    isAdmin = true;
    loginDlg.close();
    renderAdminUi();
    toast("已登录,现在可以编辑监控应用");
  } catch (err) {
    toast(err.message, "error");
  } finally {
    btn.disabled = false;
  }
});

$("#logoutBtn").addEventListener("click", async () => {
  try { await api("/api/logout", { method: "POST" }); } catch { /* 忽略 */ }
  isAdmin = false;
  renderAdminUi();
  toast("已退出,当前为只读视图");
});

/* ── 配置导入 / 导出 ── */

const importDlg = $("#importDialog");

async function exportConfig() {
  try {
    const res = await fetch("/api/apps/export");
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      if (res.status === 401 && isAdmin) { isAdmin = false; renderAdminUi(); }
      throw new Error(d.error || "导出失败(HTTP " + res.status + ")");
    }
    const blob = await res.blob();
    const cd = res.headers.get("content-disposition") || "";
    const name = (cd.match(/filename="?([^";]+)"?/) || [])[1] || "app-version-backup.json";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    toast("配置已导出");
  } catch (e) {
    toast(e.message, "error");
  }
}

$("#exportBtn").addEventListener("click", exportConfig);
$("#importBtn").addEventListener("click", () => { $("#importFile").value = ""; importDlg.showModal(); });
$("#importCancelBtn").addEventListener("click", () => importDlg.close());
importDlg.addEventListener("click", (e) => { if (e.target === importDlg) importDlg.close(); });

$("#importForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const file = $("#importFile").files[0];
  if (!file) { toast("请选择配置文件", "error"); return; }
  let parsed;
  try {
    parsed = JSON.parse(await file.text());
  } catch {
    toast("文件不是合法的 JSON", "error");
    return;
  }
  const records = Array.isArray(parsed) ? parsed : parsed.apps;
  if (!Array.isArray(records)) { toast("文件格式不正确:缺少 apps 数组", "error"); return; }
  if (!confirm("导入将覆盖当前全部应用列表(现有 " + apps.length + " 个),确定继续吗?")) return;
  const btn = $("#importSubmitBtn");
  btn.disabled = true;
  try {
    const r = await api("/api/apps/import", { method: "POST", body: { apps: records } });
    toast("已导入 " + r.imported + " 个应用");
    importDlg.close();
    apps = await api("/api/apps");
    render();
  } catch (err) {
    toast(err.message, "error");
  } finally {
    btn.disabled = false;
  }
});

/* ── 主题切换(浅色 / 深色,默认浅色)── */

const THEME_ICONS = {
  // 当前浅色 → 按钮显示"月亮",点击切到深色
  light: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  // 当前深色 → 按钮显示"太阳",点击切到浅色
  dark: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
};

function applyTheme(theme) {
  const dark = theme === "dark";
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  const btn = $("#themeToggle");
  btn.innerHTML = dark ? THEME_ICONS.dark : THEME_ICONS.light;
  const label = dark ? "切换到浅色显示" : "切换到深色显示";
  btn.setAttribute("aria-label", label);
  btn.title = label;
  // 移动端浏览器地址栏配色跟随
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = dark ? "#333" : "#f4f6fb";
}

$("#themeToggle").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem("av_theme", next); } catch { /* 隐私模式下忽略 */ }
});

/* ── 事件绑定 ── */

listEl.addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  const card = btn.closest(".card");
  const app = apps.find((a) => a.id === (card && card.dataset.id));
  if (!app) return;
  if (btn.classList.contains("act-refresh")) refreshOne(app.id, btn);
  else if (btn.classList.contains("act-edit")) openDialog(app);
  else if (btn.classList.contains("act-del")) del(app);
  else if (btn.classList.contains("act-marked")) markUpdated(app);
});

$("#searchInput").addEventListener("input", (e) => { filter.q = e.target.value; render(); });

$("#channelChips").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  filter.channel = chip.dataset.channel;
  document.querySelectorAll("#channelChips .chip").forEach((c) => c.classList.toggle("active", c === chip));
  render();
});

$("#refreshAllBtn").addEventListener("click", refreshAll);
$("#addBtn").addEventListener("click", () => openDialog(null));
$("#emptyAddBtn").addEventListener("click", () => openDialog(null));

(async () => {
  applyTheme(document.documentElement.dataset.theme === "dark" ? "dark" : "light");
  await initSession();
  renderAdminUi();
  await load();
})();
</script>
