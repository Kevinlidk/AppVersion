<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="应用版本检测">
  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8b878"/>
      <stop offset="1" stop-color="#c98a4b"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d79a5c"/>
      <stop offset="1" stop-color="#b0743c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#f4f6fb"/>
  <!-- 箱体 -->
  <path d="M10 26h44v26a3 3 0 0 1-3 3H13a3 3 0 0 1-3-3z" fill="url(#box)"/>
  <!-- 箱盖 -->
