# Cloudflare Workers 配置
# 部署:本文件是"基础配置",KV 绑定等由部署脚本补充 —— 见文件末尾说明。
#   npm run deploy   # 生成 wrangler.generated.toml 后部署(推荐)
#   npm run dev      # 本地开发(同样先注入 KV)

name = "app-version"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# 前端静态页面目录(Workers Static Assets):
# 静态文件优先命中,未命中的 /api/* 请求交给 src/worker.js 处理
[assets]
directory = "./public"
binding = "ASSETS"

# ── 管理员密码(必配)─────────────────────────────────────
# 编辑监控应用需要管理员登录;访客只读。
# 部署后必须设置环境变量/Secret:
#   npx wrangler secret put ADMIN_PASSWORD
# 或在 Dashboard「设置 → 变量和机密」中添加 ADMIN_PASSWORD。
# 未配置时所有编辑接口都会拒绝(页面保持只读),不会放行。

# ── 定时检查更新 + 推送通知 ──────────────────────────────
# 现由 GitHub Actions 驱动(.github/workflows/check-updates.yml),
# 通过 HTTP 调用 POST /api/check,因此本文件不再声明 Cron Trigger
# (Cloudflare 账号的 crons 名额已达上限)。
#
# 手动触发一次检查可在本地执行:
#   curl -X POST https://appversion.kevinlidk.cn/api/check \
#        -H "Authorization: Bearer $CRON_SECRET"
#
# 如日后 Cloudflare cron 名额空出、想改回平台定时任务,
# 取消下面三行注释即可(并在 GitHub 仓库停用对应 workflow,
# 两者同时启用会导致重复检查与重复推送):
#
# [triggers]
# crons = ["30 */6 * * *"]

# ── 定时检查令牌(本方案必配)──────────────────────────────
# GitHub Actions 调用 POST /api/check 时需携带此令牌:
#   npx wrangler secret put CRON_SECRET
# 未配置时该接口只接受管理员会话,自动化调用会被拒绝。

# ── KV 存储(必配,ID 由环境变量注入)─────────────────────
# KV 绑定不是普通环境变量:wrangler.toml 不支持 ${VAR} 插值,id 必须是字面量。
# 因此本项目把 ID 放在环境变量里,由部署脚本在部署前注入:
#
#   scripts/build-config.mjs 读取 KV_NAMESPACE_ID
#     → 生成 wrangler.generated.toml(已 gitignore)
#     → 再用它执行 wrangler deploy
#
# 所以本文件【不要】再写 [[kv_namespaces]],否则会和生成配置重复。
#
# ▶ Cloudflare Workers Builds(当前部署方式)
#   设置 → 构建:
#     · 部署命令(Deploy command)改为:npm run deploy
#     · 变量和密钥 → 添加 KV_NAMESPACE_ID = <32 位命名空间 ID>
#   获取 ID:Dashboard →「存储和数据库」→「KV」→ 点开命名空间,复制顶部 ID
#
# ▶ 本地开发
#   项目根目录 .dev.vars 写入:KV_NAMESPACE_ID=<32 位命名空间 ID>
#   然后 npm run dev / npm run deploy 即可
#
# ▶ 还没创建过命名空间
#   npx wrangler kv namespace create APP_KV
#   或 Dashboard「存储和数据库 → KV」点「创建」,再复制 ID

# ── 其它说明 ─────────────────────────────────────────────
# 本地纯静态预览(不需要 KV):npm run serve

[observability]
enabled = true
