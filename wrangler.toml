# Cloudflare Workers 配置
# 部署:Dashboard 导入本仓库后自动构建;或本地执行 `npx wrangler deploy`

name = "app-version"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# 前端静态页面目录(Workers Static Assets):
# 静态文件优先命中,未命中的 /api/* 请求交给 src/worker.js 处理
[assets]
directory = "./public"
binding = "ASSETS"

# ── 管理员密码(必配)─────────────────────────────────────
# 编辑监控应用需要管理员登录;访客只读。
# 部署后必须设置环境变量/Secret:
#   npx wrangler secret put ADMIN_PASSWORD
# 或在 Dashboard「设置 → 变量和机密」中添加 ADMIN_PASSWORD。
# 未配置时所有编辑接口都会拒绝(页面保持只读),不会放行。

# ── 定时检查更新 + 推送通知 ──────────────────────────────
# 现由 GitHub Actions 驱动(.github/workflows/check-updates.yml),
# 通过 HTTP 调用 POST /api/check,因此本文件不再声明 Cron Trigger
# (Cloudflare 账号的 crons 名额已达上限)。
#
# 手动触发一次检查可在本地执行:
#   curl -X POST https://app-version.kevinlidk.cn/api/check \
#        -H "Authorization: Bearer $CRON_SECRET"
#
# 如日后 Cloudflare cron 名额空出、想改回平台定时任务,
# 取消下面三行注释即可(并在 GitHub 仓库停用对应 workflow,
# 两者同时启用会导致重复检查与重复推送):
#
# [triggers]
# crons = ["30 */6 * * *"]

# ── 定时检查令牌(本方案必配)──────────────────────────────
# GitHub Actions 调用 POST /api/check 时需携带此令牌:
#   npx wrangler secret put CRON_SECRET
# 未配置时该接口只接受管理员会话,自动化调用会被拒绝。

# ── KV 存储(必配)────────────────────────────────────────
# ⚠️ 重要:KV 绑定必须写在本文件里,不要只在 Dashboard 手动添加。
#    因为本项目通过 Git 集成部署(GitHub → Cloudflare Workers Builds),
#    每次部署都会以本文件为准重建 Worker 配置,只存在于 Dashboard 的
#    绑定会在下一次部署时被清掉(表现为页面提示"未绑定 KV 存储")。
#
# ▶ 填写步骤:
#   1. Cloudflare Dashboard →「存储和数据库」→「KV」
#      找到本项目的命名空间,点进去复制页面顶部的 ID
#      (32 位十六进制,形如 a1b2c3d4e5f67890a1b2c3d4e5f67890)
#   2. 把下面 REPLACE_WITH_YOUR_KV_NAMESPACE_ID 替换成该 ID
#   3. 提交推送 → 等待 Cloudflare 重新部署,绑定会自动重建
#
# 若还没创建过命名空间:
#   npx wrangler kv namespace create APP_KV
# 或在 Dashboard「存储和数据库 → KV」点「创建」,然后把 ID 填到下面。

[[kv_namespaces]]
binding = "APP_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[observability]
enabled = true
